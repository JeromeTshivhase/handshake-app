version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    container_name: handshake-postgres
    environment:
      POSTGRES_DB: handshake
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - handshake_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: handshake-redis
    ports:
      - "6379:6379"

volumes:
  handshake_pg: