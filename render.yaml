services:
  - type: web
    name: handshake-app
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production

      # ── Database ──────────────────────────────────────────────────────────
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # ── Auth / JWT ────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false

      # ── Mail ─────────────────────────────────────────────────────────────
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

      # ── PayFast ───────────────────────────────────────────────────────────
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PAYFAST_MODE          # must be "live" in production
        sync: false
      - key: PAYFAST_RETURN_URL
        sync: false
      - key: PAYFAST_CANCEL_URL
        sync: false
      - key: PAYFAST_NOTIFY_URL
        sync: false
      - key: PAYFAST_IP_CHECK_ENABLED
        sync: false

      # ── Redis ─────────────────────────────────────────────────────────────
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false

      # ── Cloudinary ────────────────────────────────────────────────────────
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── App ───────────────────────────────────────────────────────────────
      - key: APP_DOMAIN
        sync: false
      - key: APP_OTP_REVEAL_KEY_B64
        sync: false
      - key: APP_ALLOWED_RETURN_URL_HOSTS
        sync: false

      # ── CORS ──────────────────────────────────────────────────────────────
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false
      - key: CORS_MAX_AGE_SECONDS
        sync: false

      # ── Swagger — set to true only in staging, never in production ────────
      - key: SWAGGER_ENABLED
        value: "false"

      # ── Optional tuning ───────────────────────────────────────────────────
      - key: APP_HTTP_CACHE_PUBLIC_MAX_AGE_SECONDS
        sync: false
      - key: HIBERNATE_FORMAT_SQL
        sync: false
      - key: DB_POOL_MAX_SIZE
        sync: false
      - key: DB_POOL_MIN_IDLE
        sync: false
      - key: DB_POOL_CONNECTION_TIMEOUT_MS
        sync: false
      - key: DB_POOL_IDLE_TIMEOUT_MS
        sync: false
      - key: DB_POOL_MAX_LIFETIME_MS
        sync: false
