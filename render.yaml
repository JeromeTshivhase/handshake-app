services:
  - type: web
    name: handshake-app
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PAYFAST_MODE
        sync: false
      - key: PAYFAST_RETURN_URL
        sync: false
      - key: PAYFAST_CANCEL_URL
        sync: false
      - key: PAYFAST_NOTIFY_URL
        sync: false
      - key: APP_DOMAIN
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false

