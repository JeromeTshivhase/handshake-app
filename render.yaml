services:
  - type: web
    name: handshake-app
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PAYFAST_MODE
        sync: false
      - key: PAYFAST_RETURN_URL
        sync: false
      - key: PAYFAST_CANCEL_URL
        sync: false
      - key: PAYFAST_NOTIFY_URL
        sync: false
      - key: APP_DOMAIN
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: CORS_MAX_AGE_SECONDS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false
      - key: APP_HTTP_CACHE_PUBLIC_MAX_AGE_SECONDS
        sync: false
      - key: HIBERNATE_FORMAT_SQL
        sync: false
      - key: DB_POOL_MAX_SIZE
        sync: false
      - key: DB_POOL_MIN_IDLE
        sync: false
      - key: DB_POOL_CONNECTION_TIMEOUT_MS
        sync: false
      - key: DB_POOL_IDLE_TIMEOUT_MS
        sync: false
      - key: DB_POOL_MAX_LIFETIME_MS
        sync: false
