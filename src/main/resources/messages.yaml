# Default English messages for notifications and user-facing strings
notification:
  user:
    created: "Welcome to Handshake"
    created_body: "Your account has been created successfully."
  payment:
    initiated: "Payment started"
    initiated_body: "Your payment for '{0}' has been initiated."
    initiated_seller: "Buyer started payment"
    initiated_seller_body: "A payment of {0} has been initiated for your listing '{1}'."
    paid: "Payment successful"
    paid_body: "Your payment for '{0}' was successful and is now held in escrow."
    paid_seller: "Payment received in escrow"
    paid_seller_body: "Payment for your listing '{0}' was successful and is now held in escrow."
    failed: "Payment failed"
    failed_body: "Your payment for '{0}' failed."
    failed_seller: "Buyer payment failed"
    failed_seller_body: "The payment attempt for your listing '{0}' failed."
  transaction:
    completed: "Transaction completed"
    completed_body: "You completed the transaction for '{0}'."
    completed_seller: "Sale completed"
    completed_seller_body: "Your transaction for '{0}' has been completed."
  password:
    reset: "Password Reset Request"
    reset_body: "You requested a password reset. Use the following link to reset your password: {0}\nIf you did not request this, please ignore this email."

  handshake:
    request: "New handshake request"
    request_body: "A buyer has requested to buy '{0}'."
    accepted: "Handshake accepted"
    accepted_body: "Your handshake request for '{0}' was accepted."
    rejected: "Handshake rejected"
    rejected_body: "Your handshake request for '{0}' was rejected."
    cancelled: "Handshake cancelled"
    cancelled_body: "The handshake for '{0}' has been cancelled."

  meetup:
    scheduled: "Meetup scheduled"
    scheduled_body: "A meetup has been scheduled at '{0}'."

  otp:
    enabled: "OTP enabled"
    enabled_body: "OTP has been enabled for your meetup at '{0}'."
    verified: "OTP verified"
    verified_body: "OTP verification succeeded for '{0}'."

  escrow:
    released: "Escrow funds released"
    released_body: "Escrow funds for '{0}' have been released to the seller."
    released_seller: "Escrow released to you"
    released_seller_body: "Escrow for your listing '{0}' has been released to your account."

