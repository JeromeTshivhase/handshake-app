# =========================
# Server & JWT
# =========================
server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
  http2:
    enabled: true
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:200}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
    keep-alive-timeout: ${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:30000}
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:5000}

jwt:
  secret: ${JWT_SECRET}
  access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:3600}
  refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:1209600}

# =========================
# Spring configuration (merged)
# =========================
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/handshake}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
  flyway:
    enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT_MS:2000}

  jackson:
    time-zone: ${APP_TIMEZONE:UTC}
    serialization:
      write-dates-as-timestamps: false

# =========================
# PayFast
# =========================
payfast:
  merchant-id: ${PAYFAST_MERCHANT_ID}
  merchant-key: ${PAYFAST_MERCHANT_KEY}
  passphrase: ${PAYFAST_PASSPHRASE:}
  mode: ${PAYFAST_MODE}
  # Ask PayFast to confirm every ITN (recommended; keep true)
  server-validation-enabled: ${PAYFAST_SERVER_VALIDATION_ENABLED:true}
  return-url: ${PAYFAST_RETURN_URL:${APP_DOMAIN:https://overintense-unrelatedly-lilly.ngrok-free.dev}/payment/success}
  cancel-url: ${PAYFAST_CANCEL_URL:${APP_DOMAIN:https://overintense-unrelatedly-lilly.ngrok-free.dev}/payment/cancel}
  notify-url: ${PAYFAST_NOTIFY_URL:${APP_DOMAIN:https://overintense-unrelatedly-lilly.ngrok-free.dev}/api/payments/payfast/notify}
  # Comma-separated CIDR ranges that PayFast uses to POST ITN notifications.
  # Include all currently published PayFast source ranges plus single host 144.126.193.139.
  allowed-ips: ${PAYFAST_ALLOWED_IPS:197.97.145.144/28,41.74.179.192/27,102.216.36.0/28,102.216.36.128/28,144.126.193.139}
  # Set to false in development / sandbox to bypass IP check.
  ip-check-enabled: ${PAYFAST_IP_CHECK_ENABLED:true}

# =========================
# App-specific configs
# =========================
app:
  domain: ${APP_DOMAIN:}
  # Web frontend base URL for links in emails (e.g. password reset). Falls back to APP_DOMAIN when empty.
  frontend-url: ${FRONTEND_URL:}
  reset-password-path: ${APP_RESET_PASSWORD_PATH:/auth/reset-password}
  enforce-domain-in-prod: ${APP_ENFORCE_DOMAIN_IN_PROD:true}
  redis:
    enabled: ${REDIS_ENABLED:true}
  otp:
    reveal-key-b64: ${APP_OTP_REVEAL_KEY_B64}
  # Comma-separated hostnames whose returnUrl is accepted (empty = allow all).
  allowed-return-url-hosts: ${APP_ALLOWED_RETURN_URL_HOSTS:}
  upload:
    dir: ./uploads
    base-url: ${APP_UPLOAD_BASE_URL:${APP_DOMAIN:}/uploads}
  http-cache:
    public-max-age-seconds: ${APP_HTTP_CACHE_PUBLIC_MAX_AGE_SECONDS:60}
  # Optional: send email through Brevo's HTTPS API instead of SMTP (for hosts that block SMTP, e.g. Railway
  # non-Pro plans). Active only when BREVO_API_KEY is set; sender must be verified in Brevo.
  mail:
    brevo:
      api-key: ${BREVO_API_KEY:}
      sender-email: ${BREVO_SENDER_EMAIL:${MAIL_FROM:}}
      sender-name: ${BREVO_SENDER_NAME:Handshake}

handshake:
  pending-expiry-hours: ${HANDSHAKE_PENDING_EXPIRY_HOURS:48}
  accepted-unpaid-expiry-hours: ${HANDSHAKE_ACCEPTED_UNPAID_EXPIRY_HOURS:24}
  min-expiry-lead-seconds: ${HANDSHAKE_MIN_EXPIRY_LEAD_SECONDS:30}
  expiry-grace-seconds: ${HANDSHAKE_EXPIRY_GRACE_SECONDS:30}

escrow:
  trust:
    thresholds:
      trusted-score: ${ESCROW_TRUSTED_SCORE_THRESHOLD:80}
      verified-score: ${ESCROW_VERIFIED_SCORE_THRESHOLD:60}
      standard-score: ${ESCROW_STANDARD_SCORE_THRESHOLD:40}
      limited-score: ${ESCROW_LIMITED_SCORE_THRESHOLD:20}
      high-value: ${ESCROW_HIGH_VALUE_THRESHOLD:5000}
    hold-hours:
      trusted: ${ESCROW_TRUSTED_HOLD_HOURS:0}
      verified: ${ESCROW_VERIFIED_HOLD_HOURS:24}
      standard: ${ESCROW_STANDARD_HOLD_HOURS:48}
      limited: ${ESCROW_LIMITED_HOLD_HOURS:168}
      restricted: ${ESCROW_RESTRICTED_HOLD_HOURS:336}
    high-value-extra-hold-hours: ${ESCROW_HIGH_VALUE_EXTRA_HOLD_HOURS:24}

otp:
  expires-minutes: ${SAFE_MEETUP_OTP_EXPIRES_MINUTES:10}
  max-failed-attempts: ${SAFE_MEETUP_OTP_MAX_FAILED_ATTEMPTS:5}
  lock-minutes: ${SAFE_MEETUP_OTP_LOCK_MINUTES:15}

# =========================
# Cloudinary
# =========================
cloudinary:
  url: ${CLOUDINARY_URL:}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:handshake-app/uploads}

# =========================
# Verification & OTP
# =========================
verification:
  email:
    enabled: true
    from: ${MAIL_FROM}
  sms:
    enabled: false
  otp:
    expires-minutes: 10
    max-failed-attempts: 5
    lock-minutes: 15

# =========================
# CORS
# =========================
cors:
  max-age-seconds: ${CORS_MAX_AGE_SECONDS:86400}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:5173,https://handshake-app-bd3y.onrender.com,https://trustmarket-app-1.onrender.com,https://trusty-marketplace-flow.onrender.com,https://handshake-app-production-3b09.up.railway.app,https://id-preview--a165c56a-afbb-4d6c-831c-f60cbbfd31a8.lovable.app,https://a165c56a-afbb-4d6c-831c-f60cbbfd31a8.lovableproject.com}
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://id-preview--*.lovable.app,https://*.lovableproject.com}

messaging:
  max-content-length: ${APP_MESSAGING_MAX_CONTENT_LENGTH:5000}
  preview-length: ${APP_MESSAGING_PREVIEW_LENGTH:100}
  rate-limit:
    messages-per-minute: ${APP_MESSAGING_MESSAGES_PER_MINUTE:30}
  safety:
    mode: ${APP_MESSAGING_SAFETY_MODE:warn}
    sanitize-content: ${APP_MESSAGING_SANITIZE_CONTENT:true}
    block-social-handles: ${APP_MESSAGING_BLOCK_SOCIAL_HANDLES:false}
    block-phone-numbers: ${APP_MESSAGING_BLOCK_PHONE_NUMBERS:false}
  email:
    enabled: ${APP_MESSAGING_EMAIL_ENABLED:true}
    from: ${APP_MESSAGING_EMAIL_FROM:no-reply@handshake.local}
    rate-limit:
      per-hour: ${APP_MESSAGING_EMAIL_PER_HOUR:10}

# =========================
# Actuator — expose only health publicly
# =========================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# =========================
# Springdoc / Swagger — disabled by default; enable via env-var in dev/staging only
# =========================
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
