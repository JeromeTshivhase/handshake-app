# =========================
# Server & JWT
# =========================
server:
  port: ${PORT:8080}
  address: 0.0.0.0
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
  http2:
    enabled: true
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:200}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
    keep-alive-timeout: ${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:30000}
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:5000}

jwt:
  secret: ${JWT_SECRET:changemechangemechangemechangeme12}
  access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:3600}
  refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:1209600}

# =========================
# Spring configuration (merged)
# =========================
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/handshake}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
  flyway:
    enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:trustymarkets@gmail.com}
    password: ${MAIL_PASSWORD:twmktsjmfhezzito}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT_MS:2000}

# =========================
# PayFast
# =========================
payfast:
  merchant-id: ${PAYFAST_MERCHANT_ID:10037006}
  merchant-key: ${PAYFAST_MERCHANT_KEY:dyun7jo0pqesu}
  passphrase: ${PAYFAST_PASSPHRASE:sslsllyghjwuwi8786gw}
  mode: ${PAYFAST_MODE:sandbox}
  return-url: ${PAYFAST_RETURN_URL:https://overintense-unrelatedly-lilly.ngrok-free.dev/payment/success}
  cancel-url: ${PAYFAST_CANCEL_URL:https://overintense-unrelatedly-lilly.ngrok-free.dev/payment/cancel}
  notify-url: ${PAYFAST_NOTIFY_URL:https://overintense-unrelatedly-lilly.ngrok-free.dev/api/payments/payfast/notify}

# =========================
# App-specific configs
# =========================
app:
  domain: ${APP_DOMAIN:https://handshake-app-production-3b09.up.railway.app}
  upload:
    dir: ./uploads
    base-url: ${APP_DOMAIN}/uploads
  http-cache:
    public-max-age-seconds: ${APP_HTTP_CACHE_PUBLIC_MAX_AGE_SECONDS:60}

# =========================
# Cloudinary
# =========================
cloudinary:
  url: ${CLOUDINARY_URL:}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:handshake-app/uploads}

# =========================
# Verification & OTP
# =========================
verification:
  email:
    enabled: true
    from: ${MAIL_FROM:trustymarkets@gmail.com}
  sms:
    enabled: false
  otp:
    expires-minutes: 10
    max-failed-attempts: 5
    lock-minutes: 15

# =========================
# CORS
# =========================
cors:
  max-age-seconds: ${CORS_MAX_AGE_SECONDS:86400}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,https://handshake-app-bd3y.onrender.com,https://trustmarket-app-1.onrender.com,https://handshake-app-production-3b09.up.railway.app}