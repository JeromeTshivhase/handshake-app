spring:
  datasource:
    url: jdbc:h2:mem:handshake-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

jwt:
  secret: test-secret-test-secret-test-secret-1234
  access-expiration-seconds: 3600
  refresh-expiration-seconds: 1209600

payfast:
  merchant-id: test-merchant-id
  merchant-key: test-merchant-key
  passphrase:
  mode: sandbox
  return-url: http://localhost/payment/success
  cancel-url: http://localhost/payment/cancel
  notify-url: http://localhost/api/payments/payfast/notify

app:
  redis:
    enabled: false
  otp:
    reveal-key-b64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  messaging:
    email:
      enabled: false
  notifications:
    email:
      enabled: false
